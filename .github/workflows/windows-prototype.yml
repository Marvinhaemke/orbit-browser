name: Windows native prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbit-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and verify native Orbit (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      MOZILLABUILD: C:\mozilla-build
      MOZ_AUTOMATION: '1'
      MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
      MACH_HIDE_DEV_DRIVE_SUGGESTION: '1'
      MACH_TELEMETRY_NO_SUBMIT: '1'
      MOZBUILD_STATE_PATH: C:\orbit-mozbuild
    steps:
      - name: Check out Orbit source changes
        uses: actions/checkout@v4

      - name: Install Python for verification scripts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node for native interface checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test source preparation guards
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Test Windows updater integrity and rollback
        shell: powershell
        run: ./scripts/test_update.ps1

      - name: Check native interface and tab bridge behavior
        shell: pwsh
        run: |
          python -c "from pathlib import Path; scope = {'MOZ_SRC_FILES': []}; exec(Path('overlay/browser/components/orbit/moz.build').read_text(), scope); assert scope['MOZ_SRC_FILES'] == sorted(scope['MOZ_SRC_FILES']), 'Firefox source modules must be sorted'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check overlay/browser/components/orbit/Orbit.sys.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check overlay/browser/base/content/orbit/orbit.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native-bridge.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($module in 'OrbitFocusTools', 'OrbitInteractions', 'OrbitTheme', 'OrbitRadial', 'OrbitRadialChild', 'OrbitRadialParent', 'OrbitRadialView') {
            node --check "overlay/browser/components/orbit/$module.sys.mjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node tests/radial-view.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/radial-native.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/interactions.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/focus-tools.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Find tested installation and matching internal native candidate
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const workflow = '.github/workflows/windows-prototype.yml';
            const artifacts = await github.paginate(github.rest.actions.listArtifactsForRepo, { owner, repo, per_page: 100 });
            const eligible = artifact => !artifact.expired &&
              artifact.workflow_run?.head_branch === 'main' &&
              artifact.workflow_run?.head_repository_id === context.payload.repository.id;
            const runs = new Map();
            const trustedRun = async artifact => {
              const id = artifact.workflow_run.id;
              if (!runs.has(id)) runs.set(id, (await github.rest.actions.getWorkflowRun({ owner, repo, run_id: id })).data);
              const run = runs.get(id);
              return run.status === 'completed' && run.path === workflow && run.head_branch === 'main' &&
                ['push', 'workflow_dispatch'].includes(run.event) &&
                run.repository.id === context.payload.repository.id &&
                run.head_repository.id === context.payload.repository.id &&
                run.head_sha === artifact.workflow_run.head_sha ? run : null;
            };
            let previous;
            for (const artifact of artifacts.filter(a => a.name === 'Orbit-Windows-x64' && eligible(a))) {
              const run = await trustedRun(artifact);
              if (run?.conclusion === 'success') { previous = artifact; break; }
            }
            // This public baseline remains independent of internal native reuse.
            core.setOutput('run_id', previous?.workflow_run.id || '');
            core.setOutput('reuse', 'false');
            core.setOutput('css_baseline', '{}');
            if (previous) core.info(`Testing updates against the public browser from run ${previous.workflow_run.id}`);
            const current = fs.readFileSync(workflow, 'utf8').replace(/\r\n/g, '\n');
            const env = text => text.match(/\n    env:\n([\s\S]*?)\n    steps:/)?.[1];
            const runner = text => text.match(/\n    runs-on: ([^\n]+)/)?.[1];
            const build = text => text.match(/^      - name: Build pinned Gecko with Orbit native UI\n[\s\S]*?        run: \|\n([\s\S]*?)(?=\n      - name:)/m)?.[1];
            const nativeInput = /^(overlay\/|configs\/|firefox-source\.json$|scripts\/(build\.py|prepare_source\.py|windows-build\.sh)$)/;
            // Existing plain CSS resources can be repackaged without changing
            // native hooks, modules, localization, registration, or the engine.
            const cssPaths = [
              'overlay/browser/base/content/orbit/orbit.css',
              'overlay/browser/base/content/orbit/orbit-radial.css',
              'overlay/browser/base/content/orbit/orbit-chrome.css',
              'overlay/browser/base/content/orbit/orbit-interactions.css'
            ];
            const cssOnly = file => file.status === 'modified' && cssPaths.includes(file.filename) && !file.previous_filename;
            const candidates = artifacts.filter(a => a.name === 'Orbit-Windows-native-candidate' && eligible(a));
            if (previous) candidates.push(previous);
            for (const artifact of candidates) {
              const run = await trustedRun(artifact);
              if (!run) continue;
              const comparison = await github.rest.repos.compareCommitsWithBasehead({
                owner, repo, basehead: `${run.head_sha}...${context.sha}`, per_page: 100, page: 1
              });
              // GitHub returns changed files only on the first page, capped at 300.
              // Refuse that cap rather than infer that an incomplete comparison matches.
              const files = comparison.data.files;
              if (!files || files.length >= 300 || !['ahead', 'identical'].includes(comparison.data.status)) continue;
              if (files.some(file =>
                (nativeInput.test(file.filename) || nativeInput.test(file.previous_filename || '')) && !cssOnly(file))) continue;
              const changedCSS = files.filter(cssOnly);

              const prior = await github.rest.repos.getContent({ owner, repo, path: workflow, ref: run.head_sha });
              if (prior.data.type !== 'file' || prior.data.encoding !== 'base64') continue;
              const before = Buffer.from(prior.data.content, 'base64').toString('utf8').replace(/\r\n/g, '\n');
              if (!env(before) || !build(before) || runner(before) !== runner(current) ||
                  env(before) !== env(current) || build(before) !== build(current)) continue;
              const jobs = await github.paginate(github.rest.actions.listJobsForWorkflowRun, { owner, repo, run_id: run.id, filter: 'latest', per_page: 100 });
              const internal = artifact.name === 'Orbit-Windows-native-candidate';
              const required = internal ? [
                'Package native portable browser', 'Record internal native candidate provenance'
              ] : [
                'Package native portable browser',
                'Verify real native tabs and Orbit canvas in the packaged browser',
                'Verify native radial page actions and held tab switching'
              ];
              const job = jobs.find(job => job.name === 'Build and verify native Orbit (Windows x64)' &&
                required.every(name => job.steps?.some(step => step.name === name && step.conclusion === 'success')) &&
                (!internal || job.steps?.some(step =>
                  ['Upload internal built native candidate', 'Upload internal verified native candidate'].includes(step.name) &&
                  step.conclusion === 'success')));
              if (!job) continue;
              let cssBaseline = {};
              if (changedCSS.length) {
                let valid = true;
                for (const path of cssPaths) {
                  const source = await github.rest.repos.getContent({ owner, repo, path, ref: run.head_sha });
                  if (source.data.type !== 'file' || !/^[0-9a-f]{40}$/.test(source.data.sha)) { valid = false; break; }
                  cssBaseline[path] = source.data.sha;
                }
                if (!valid) continue;
              }
              core.setOutput('css_baseline', JSON.stringify(cssBaseline));
              core.setOutput('reuse', 'true');
              core.setOutput('reuse_run_id', run.id);
              core.setOutput('reuse_artifact_id', artifact.id);
              core.setOutput('reuse_head_sha', run.head_sha);
              core.setOutput('reuse_run_attempt', job.run_attempt);
              core.setOutput('reuse_kind', internal ? 'candidate' : 'public');
              core.info(`Native inputs, build environment and command match ${internal ? 'internal built candidate' : 'verified public browser'} from run ${run.id}${changedCSS.length ? `, except ${changedCSS.length} registered CSS resources to verify and repackage` : ''}. All fresh and updated runtime checks will run again.`);
              break;
            }

      - name: Reuse the matching verified native browser
        if: steps.baseline.outputs.reuse == 'true' && steps.baseline.outputs.reuse_kind == 'public'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.reuse_artifact_id }}
          merge-multiple: true
          path: C:/orbit-firefox/obj-orbit/dist/orbit
          run-id: ${{ steps.baseline.outputs.reuse_run_id }}
          github-token: ${{ github.token }}

      - name: Download the matching internal native candidate
        if: steps.baseline.outputs.reuse == 'true' && steps.baseline.outputs.reuse_kind == 'candidate'
        uses: actions/download-artifact@v4
        with:
          artifact-ids: ${{ steps.baseline.outputs.reuse_artifact_id }}
          merge-multiple: true
          path: artifacts/native-reuse
          run-id: ${{ steps.baseline.outputs.reuse_run_id }}
          github-token: ${{ github.token }}

      - name: Verify internal native candidate provenance and content
        if: steps.baseline.outputs.reuse == 'true' && steps.baseline.outputs.reuse_kind == 'candidate'
        shell: pwsh
        env:
          ORBIT_CANDIDATE_SHA: ${{ steps.baseline.outputs.reuse_head_sha }}
          ORBIT_CANDIDATE_RUN: ${{ steps.baseline.outputs.reuse_run_id }}
          ORBIT_CANDIDATE_ATTEMPT: ${{ steps.baseline.outputs.reuse_run_attempt }}
        run: |
          @'
          import json, os, shutil, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from package_update import native_package_files, hash_stream, read_pin
          from package_windows import verify_native_package
          root = Path('artifacts/native-reuse')
          package = root / 'Orbit'
          def record(path):
              with path.open('rb') as stream:
                  digest, size = hash_stream(stream)
              return {'path': path.relative_to(package).as_posix(), 'sha256': digest, 'size': size}
          manifest = json.loads((root / 'orbit-native-candidate.json').read_text(encoding='utf-8'))
          expected = {
              'schema_version': 1, 'kind': 'internal-native-candidate', 'platform': 'windows-x64',
              'repository': os.environ['GITHUB_REPOSITORY'], 'repository_id': os.environ['GITHUB_REPOSITORY_ID'],
              'head_sha': os.environ['ORBIT_CANDIDATE_SHA'], 'run_id': os.environ['ORBIT_CANDIDATE_RUN'],
              'run_attempt': os.environ['ORBIT_CANDIDATE_ATTEMPT'],
              'workflow': '.github/workflows/windows-prototype.yml',
              'firefox_source': json.loads(Path('firefox-source.json').read_text(encoding='utf-8')),
          }
          if any(manifest.get(key) != value for key, value in expected.items()):
              raise ValueError('Internal candidate provenance does not match the selected trusted run and source pin')
          if read_pin(package / 'firefox-source.json') != read_pin(Path('firefox-source.json')):
              raise ValueError('Internal candidate browser contains a different engine pin')
          records = [record(path) for path in native_package_files(package)]
          if not records or records != manifest.get('files'):
              raise ValueError('Internal candidate files do not match the verified content hashes')
          verify_native_package(package)
          destination = Path('C:/orbit-firefox/obj-orbit/dist/orbit')
          destination.parent.mkdir(parents=True, exist_ok=True)
          shutil.copytree(package, destination)
          print('Verified internal candidate provenance, source pin, complete file hashes, and native resources')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Repackage existing Orbit CSS in the matching native build
        if: steps.baseline.outputs.reuse == 'true' && steps.baseline.outputs.css_baseline != '{}'
        shell: pwsh
        env:
          ORBIT_CSS_BASELINE: ${{ steps.baseline.outputs.css_baseline }}
        run: |
          New-Item -ItemType Directory -Force test-results | Out-Null
          Set-Content test-results/orbit-css-baseline.json $env:ORBIT_CSS_BASELINE -Encoding utf8
          python scripts/patch_native_css.py --package C:/orbit-firefox/obj-orbit/dist/orbit --baseline test-results/orbit-css-baseline.json
          if ($LASTEXITCODE -ne 0) { throw 'Native CSS resource validation or repackaging failed' }

      - name: Install official MozillaBuild tools
        if: steps.baseline.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'MozillaBuildSetup.exe'
          Invoke-WebRequest 'https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe' -OutFile $installer
          $process = Start-Process $installer -ArgumentList '/S', '/D=C:\mozilla-build' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MozillaBuild installation failed: $($process.ExitCode)" }
          if (-not (Test-Path 'C:\mozilla-build\msys2\usr\bin\bash.exe')) { throw 'MozillaBuild Bash is missing' }
          if (-not (Test-Path 'C:\mozilla-build\python3\python.exe')) { throw 'MozillaBuild Python is missing' }
          $version = [version](Get-Content 'C:\mozilla-build\VERSION' -Raw).Trim()
          if ($version -lt [version]'4.0') { throw "Unsupported MozillaBuild version: $version" }
          Write-Host "MozillaBuild $version"

      - name: Install native artifact decompression dependency
        if: steps.baseline.outputs.reuse != 'true'
        shell: pwsh
        run: |
          & 'C:\mozilla-build\python3\python.exe' -m pip install --only-binary=:all: 'zstandard==0.25.0'
          if ($LASTEXITCODE -ne 0) { throw "Artifact dependency installation failed: $LASTEXITCODE" }

      - name: Cache pinned Gecko and toolchain downloads
        if: steps.baseline.outputs.reuse != 'true'
        uses: actions/cache@v4
        with:
          # These are the pinned upstream download caches, not Orbit's source,
          # object directory, generated interface archives, or packaged browser.
          path: |
            C:/orbit-mozbuild/package-frontend
            C:/orbit-mozbuild/toolchains
          key: orbit-mozbuild-downloads-v1-windows-2022-${{ runner.arch }}-${{ hashFiles('firefox-source.json', 'configs/mozconfig', 'scripts/build.py', 'scripts/windows-build.sh', '.github/workflows/windows-prototype.yml') }}

      - name: Build pinned Gecko with Orbit native UI
        if: steps.baseline.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $script = "$repo/scripts/windows-build.sh"
          & 'C:\mozilla-build\msys2\usr\bin\bash.exe' --noprofile --norc $script $repo C:/orbit-firefox
          if ($LASTEXITCODE -ne 0) { throw "Orbit native build failed: $LASTEXITCODE" }

      - name: Package native portable browser
        shell: pwsh
        run: python scripts/package_windows.py --source C:/orbit-firefox --output artifacts

      - name: Record internal native candidate provenance
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        shell: pwsh
        run: |
          @'
          import json, os, sys
          from pathlib import Path
          sys.path.insert(0, 'scripts')
          from package_update import native_package_files, hash_stream
          package = Path('artifacts/Orbit')
          def record(path):
              with path.open('rb') as stream:
                  digest, size = hash_stream(stream)
              return {'path': path.relative_to(package).as_posix(), 'sha256': digest, 'size': size}
          manifest = {
              'schema_version': 1, 'kind': 'internal-native-candidate', 'platform': 'windows-x64',
              'repository': os.environ['GITHUB_REPOSITORY'], 'repository_id': os.environ['GITHUB_REPOSITORY_ID'],
              'head_sha': os.environ['GITHUB_SHA'], 'run_id': os.environ['GITHUB_RUN_ID'],
              'run_attempt': os.environ['GITHUB_RUN_ATTEMPT'],
              'workflow': '.github/workflows/windows-prototype.yml',
              'firefox_source': json.loads(Path('firefox-source.json').read_text(encoding='utf-8')),
              'files': [record(path) for path in native_package_files(package)],
          }
          Path('artifacts/orbit-native-candidate.json').write_text(json.dumps(manifest, indent=2) + '\n', encoding='utf-8')
          '@ | python -
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Upload internal built native candidate
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          # Untested internal build cache. Every reuse runs all fresh and updated
          # runtime checks before public browser or update uploads.
          name: Orbit-Windows-native-candidate
          path: |
            artifacts/Orbit/
            artifacts/orbit-native-candidate.json
          if-no-files-found: error
          retention-days: 7
          overwrite: true

      - name: Install Marionette client from the pinned Firefox source
        shell: pwsh
        env:
          ORBIT_REUSE_NATIVE: ${{ steps.baseline.outputs.reuse }}
        run: |
          $ErrorActionPreference = 'Stop'
          $clientSource = 'C:/orbit-firefox'
          if ($env:ORBIT_REUSE_NATIVE -eq 'true') {
            # Fetch only the exact pinned automation client, not the whole Firefox tree.
            $clientSource = 'C:/orbit-marionette'
            $pin = Get-Content firefox-source.json -Raw | ConvertFrom-Json
            git init $clientSource
            if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the pinned test client checkout' }
            git -C $clientSource config core.longpaths true
            git -C $clientSource config core.autocrlf false
            git -C $clientSource remote add origin $pin.repository
            git -C $clientSource config remote.origin.promisor true
            git -C $clientSource config remote.origin.partialclonefilter blob:none
            git -C $clientSource sparse-checkout init --cone
            git -C $clientSource sparse-checkout set testing/marionette/client
            git -C $clientSource fetch --filter=blob:none --depth=1 origin $pin.revision
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the pinned test client' }
            git -C $clientSource checkout --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not check out the pinned test client' }
          }
          python -m pip install "$clientSource/testing/marionette/client"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test client installation failed' }

      - name: Verify real native tabs and Orbit canvas in the packaged browser
        shell: pwsh
        run: python scripts/smoke_test.py --binary artifacts/Orbit/orbit.exe --report test-results/smoke.json

      - name: Verify native radial page actions and held tab switching
        shell: pwsh
        run: python scripts/smoke_radial.py --binary artifacts/Orbit/orbit.exe --report test-results/radial/smoke.json

      - name: Verify native command bar, capture, and focus interactions
        shell: pwsh
        run: python scripts/smoke_ux.py --binary artifacts/Orbit/orbit.exe --report test-results/ux/smoke.json

      - name: Package the lightweight interface update
        shell: pwsh
        run: python scripts/package_update.py --package artifacts/Orbit --output artifacts/update --commit $env:GITHUB_SHA

      - name: Download the previous browser inside CI
        if: steps.baseline.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows-x64
          path: artifacts/Orbit-Update-Check
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Apply the update to an existing native installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $previousPin = 'artifacts/Orbit-Update-Check/firefox-source.json'
          if (Test-Path $previousPin) {
            $old = Get-Content $previousPin -Raw | ConvertFrom-Json
            $current = Get-Content firefox-source.json -Raw | ConvertFrom-Json
            if ($old.revision -ne $current.revision -or $old.artifact_revision -ne $current.artifact_revision) {
              Write-Host 'A new engine needs a complete browser; checking this engine installation instead.'
              Remove-Item artifacts/Orbit-Update-Check -Recurse -Force
            }
          }
          if (-not (Test-Path artifacts/Orbit-Update-Check/orbit.exe)) {
            Copy-Item artifacts/Orbit artifacts/Orbit-Update-Check -Recurse
          }
          New-Item -ItemType Directory artifacts/Orbit-Update-Check/profile | Out-Null
          Set-Content artifacts/Orbit-Update-Check/profile/update-preservation.txt 'Existing Orbit profile'
          # Force actual replacement of both interface archives; keep the native engine.
          Set-Content artifacts/Orbit-Update-Check/omni.ja 'Old interface archive'
          Set-Content artifacts/Orbit-Update-Check/browser/omni.ja 'Old browser interface archive'
          & ./scripts/windows/Update-Orbit.ps1 -InstallDirectory artifacts/Orbit-Update-Check -ManifestPath artifacts/update/orbit-update.json -ArchivePath artifacts/update/Orbit-UI-Update.zip -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Offline interface update failed' }
          if ((Get-Content artifacts/Orbit-Update-Check/profile/update-preservation.txt -Raw).Trim() -ne 'Existing Orbit profile') { throw 'Update changed the existing profile' }
          if (-not (Test-Path artifacts/Orbit-Update-Check/browser/.purgecaches)) { throw 'Updated UI will not invalidate startup caches' }

      - name: Verify the updated browser still renders Gecko and the canvas
        shell: pwsh
        run: |
          python scripts/smoke_test.py --binary artifacts/Orbit-Update-Check/orbit.exe --report test-results/updated/smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path artifacts/Orbit-Update-Check/browser/.purgecaches) { throw 'Firefox did not consume the interface cache invalidation marker' }

      - name: Verify radial gestures after updating an existing installation
        shell: pwsh
        run: python scripts/smoke_radial.py --binary artifacts/Orbit-Update-Check/orbit.exe --report test-results/updated/radial/smoke.json

      - name: Verify new interactions after updating an existing installation
        shell: pwsh
        run: python scripts/smoke_ux.py --binary artifacts/Orbit-Update-Check/orbit.exe --report test-results/updated/ux/smoke.json

      - name: Build the Windows installer
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $makensis = (Get-Command makensis.exe -ErrorAction SilentlyContinue).Source
          foreach ($candidate in "${env:ProgramFiles(x86)}\NSIS\makensis.exe", "$env:ProgramFiles\NSIS\makensis.exe") {
            if (!$makensis -and (Test-Path $candidate)) { $makensis = $candidate }
          }
          if (!$makensis) {
            choco install nsis --no-progress -y
            if ($LASTEXITCODE -ne 0) { throw "NSIS installation failed: $LASTEXITCODE" }
            $makensis = "${env:ProgramFiles(x86)}\NSIS\makensis.exe"
          }
          & $makensis /VERSION
          python scripts/package_installer.py --package artifacts/Orbit --output artifacts/installer --makensis $makensis
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          # The portable ZIP is the same tested browser under a stable download name.
          $portable = @(Get-ChildItem artifacts -Filter 'Orbit-Windows-x64-*.zip')
          if ($portable.Count -ne 1) { throw 'Expected exactly one portable Orbit ZIP' }
          Copy-Item $portable[0].FullName artifacts/installer/Orbit-Windows-x64-portable.zip
          $digest = (Get-FileHash artifacts/installer/Orbit-Windows-x64-portable.zip -Algorithm SHA256).Hash.ToLowerInvariant()
          Set-Content artifacts/installer/Orbit-Windows-x64-portable.zip.sha256 "$digest  Orbit-Windows-x64-portable.zip" -Encoding ascii

      - name: Verify the installer installs, updates, reinstalls, and refuses a running Orbit
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = (Resolve-Path artifacts/installer/Orbit-Setup.exe).Path
          $package = (Resolve-Path artifacts/Orbit).Path
          $target = 'C:\orbit-installer-check'
          $profileDir = "$target\profile"
          $programs = [Environment]::GetFolderPath('Programs')
          function Stop-InstalledOrbit {
            $running = @(Get-Process orbit -ErrorAction SilentlyContinue | Where-Object { $_.Path -like "$target\*" })
            $running | Stop-Process -Force
            $running | Wait-Process -Timeout 60 -ErrorAction SilentlyContinue
          }
          $result = Start-Process $setup -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Silent install failed: $($result.ExitCode)" }

          # The installation is the tested package, apart from the portable instructions.
          foreach ($file in Get-ChildItem $package -Recurse -File) {
            $relative = $file.FullName.Substring($package.Length + 1)
            if ($relative -eq 'START-HERE.txt') { continue }
            $installed = Join-Path $target $relative
            if (!(Test-Path -LiteralPath $installed) -or (Get-FileHash -LiteralPath $installed).Hash -ne (Get-FileHash -LiteralPath $file.FullName).Hash) {
              throw "Installed $relative differs from the tested package"
            }
          }
          if (Test-Path "$target\START-HERE.txt") { throw 'The portable instructions were installed' }
          foreach ($name in '.orbit-install\Uninstall Orbit.exe', '.orbit-install\orbit.ico', 'profile', 'browser\.purgecaches') {
            if (!(Test-Path (Join-Path $target $name))) { throw "Installer did not create $name" }
          }
          $shell = New-Object -ComObject WScript.Shell
          $shortcut = $shell.CreateShortcut((Join-Path $programs 'Orbit.lnk'))
          if ($shortcut.TargetPath -ne "$target\orbit.exe" -or $shortcut.Arguments -ne "-profile `"$profileDir`"" -or $shortcut.WorkingDirectory -ne $target) {
            throw "Start menu shortcut is wrong: $($shortcut.TargetPath) $($shortcut.Arguments) in $($shortcut.WorkingDirectory)"
          }
          if ($shell.CreateShortcut((Join-Path $programs 'Update Orbit.lnk')).TargetPath -ne "$target\Update-Orbit.cmd") { throw 'Update shortcut is wrong' }
          $uninstall = Get-ItemProperty 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Orbit'
          if ($uninstall.DisplayName -ne 'Orbit' -or $uninstall.InstallLocation -ne $target -or
              $uninstall.QuietUninstallString -ne "`"$target\.orbit-install\Uninstall Orbit.exe`" /S") {
            throw 'Apps and Features registration is wrong'
          }

          # The installed browser starts with its own profile, as the shortcuts start it.
          $launched = Get-Date
          $orbit = Start-Process "$target\orbit.exe" -ArgumentList "-headless -profile `"$profileDir`"" -PassThru
          $started = $false
          while (!$started -and (Get-Date) -lt $launched.AddSeconds(120)) {
            Start-Sleep -Seconds 2
            $started = (Test-Path "$profileDir\compatibility.ini") -and ([IO.File]::ReadAllText("$profileDir\compatibility.ini") -match 'LastVersion=')
            if (!$started -and $orbit.HasExited) { throw "The installed Orbit exited with $($orbit.ExitCode)" }
          }
          if (!$started) { throw 'The installed Orbit did not start with its profile' }

          # Setup must not replace a running browser.
          $result = Start-Process $setup -ArgumentList '/S', "/D=$target" -Wait -PassThru
          if ($result.ExitCode -eq 0) { throw 'Setup replaced files of a running Orbit' }
          if ((Get-FileHash "$target\xul.dll").Hash -ne (Get-FileHash "$package\xul.dll").Hash) { throw 'Setup changed the running installation' }
          Stop-InstalledOrbit

          # The installed updater accepts the installation, including the uninstaller.
          Set-Content "$profileDir\installer-preservation.txt" 'Existing Orbit profile'
          Set-Content "$target\omni.ja" 'Old interface archive'
          Set-Content "$target\browser\omni.ja" 'Old browser interface archive'
          & "$target\Update-Orbit.ps1" -ManifestPath artifacts/update/orbit-update.json -ArchivePath artifacts/update/Orbit-UI-Update.zip -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'The interface update failed in the installed copy' }
          $manifest = Get-Content artifacts/update/orbit-update.json -Raw | ConvertFrom-Json
          foreach ($file in $manifest.files) {
            if ((Get-FileHash (Join-Path $target $file.path)).Hash -ne $file.sha256) { throw "Update did not install $($file.path)" }
          }

          # Running Setup again replaces the program and keeps the profile.
          $result = Start-Process $setup -ArgumentList '/S' -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Reinstall failed: $($result.ExitCode)" }
          if ((Get-Content "$profileDir\installer-preservation.txt" -Raw).Trim() -ne 'Existing Orbit profile') { throw 'Reinstall changed the profile' }
          foreach ($stale in '.orbit-update-backup', 'orbit-ui-version.json') {
            if (Test-Path (Join-Path $target $stale)) { throw "Reinstall kept stale $stale" }
          }
          if (!(Test-Path "$target\browser\.purgecaches")) { throw 'Reinstall will not invalidate compiled interface caches' }
          if ((Get-FileHash "$target\omni.ja").Hash -ne (Get-FileHash "$package\omni.ja").Hash) { throw 'Reinstall did not restore the packaged interface' }

      - name: Verify real native tabs and the canvas in the installed browser
        shell: pwsh
        run: python scripts/smoke_test.py --binary C:/orbit-installer-check/orbit.exe --report test-results/installed/smoke.json

      - name: Verify the uninstaller removes Orbit and keeps the profile
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $target = 'C:\orbit-installer-check'
          $programs = [Environment]::GetFolderPath('Programs')
          # _? runs the uninstaller in place, so it remains as the only program file.
          $result = Start-Process "$target\.orbit-install\Uninstall Orbit.exe" -ArgumentList '/S', "_?=$target\.orbit-install" -Wait -PassThru
          if ($result.ExitCode -ne 0) { throw "Silent uninstall failed: $($result.ExitCode)" }
          $left = @(Get-ChildItem $target -Force | ForEach-Object Name | Sort-Object)
          if (($left -join ',') -ne '.orbit-install,profile') { throw "Uninstall left: $($left -join ', ')" }
          if ((@(Get-ChildItem "$target\.orbit-install" -Force | ForEach-Object Name) -join ',') -ne 'Uninstall Orbit.exe') { throw 'Uninstall left installer state' }
          if ((Get-Content "$target\profile\installer-preservation.txt" -Raw).Trim() -ne 'Existing Orbit profile') { throw 'Uninstall changed the kept profile' }
          foreach ($shortcut in 'Orbit.lnk', 'Update Orbit.lnk') {
            if (Test-Path (Join-Path $programs $shortcut)) { throw "Uninstall left the $shortcut shortcut" }
          }
          if (Test-Path 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\Orbit') { throw 'Uninstall left the Apps and Features entry' }
          if (Test-Path 'HKCU:\Software\Orbit') { throw 'Uninstall left the Orbit registry key' }
          Remove-Item $target -Recurse -Force

      - name: Upload tested Windows installer and portable download
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-Installer
          path: artifacts/installer/
          if-no-files-found: error
          retention-days: 14

      - name: Upload tested lightweight update and setup
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-UI-Update
          path: artifacts/update/
          if-no-files-found: error
          retention-days: 14

      - name: Upload tested Windows browser
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-x64
          path: artifacts/Orbit/
          if-no-files-found: error
          retention-days: 14

      - name: Collect native build diagnostic logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          $logs = @{
            'C:/orbit-firefox/obj-orbit/config.log' = 'test-results/config.log'
            'C:/orbit-firefox/.mozconfig' = 'test-results/mozconfig.txt'
            'C:/orbit-firefox/.orbit-source.json' = 'test-results/firefox-source.json'
          }
          foreach ($source in $logs.Keys) {
            if (Test-Path $source) { Copy-Item -Path $source -Destination $logs[$source] -Force }
          }

      - name: Upload verification and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish-update:
    name: Publish tested Windows installer and interface update
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download verified interface update
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows-UI-Update
          path: update

      - name: Download the verified installer and portable browser
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows-Installer
          path: installer

      - name: Download the verified browser for the online updater check
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows-x64
          path: online-browser

      - name: Publish the Windows release and update channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ORBIT_COMMIT: ${{ github.sha }}
        run: |
          download="https://github.com/$GH_REPO/releases/download/windows-prototype"
          cat > release-notes.md <<EOF
          ## Download Orbit for Windows

          **[Orbit-Setup.exe]($download/Orbit-Setup.exe)**: download it, double-click it, and click through three short steps. Orbit installs for your Windows account only, so it does not need administrator rights, and it appears in the Start menu. Remove it from Settings › Apps like any other app; your browsing data is kept unless you choose to delete it.

          To pin Orbit to the taskbar, right-click **Orbit** in the Start menu and choose **Pin to taskbar**.

          Requires 64-bit Windows 10 or 11. This early build is not code-signed yet, so Windows SmartScreen may say it protected your PC: choose **More info**, then **Run anyway**.

          Prefer no installation? **[Orbit-Windows-x64-portable.zip]($download/Orbit-Windows-x64-portable.zip)** is the same browser. Extract it to a writable folder and run Launch-Orbit.cmd.

          ## Updating

          Close Orbit, then open **Update Orbit** from the Start menu (in a portable folder, run Update-Orbit.cmd). It installs the newest tested interface and keeps your profile and the Gecko engine. Running a newer Orbit-Setup.exe also updates an installation in place. A new Gecko engine always needs a new Orbit-Setup.exe or portable download.

          Portable folders with an older updater: download Orbit-Update-Setup.zip once and replace its two files beside orbit.exe.

          ## What Orbit does

          - Every new tab and window opens the Orbit canvas, a full-page spatial workspace with floating menus. Arrange real tabs as cards, group them in frames, and add notes, connections, and drawings.
          - Focus mode is the default. Approach the top middle for the address island, the top-left corner for a quarter-circle tools menu whose corner opens a new tab, or the top right for the window controls. Alt+Shift+F toggles it.
          - A quick right-click on a webpage opens radial page actions with Open in new tab in the center. Hold the right button to switch tabs, including tab groups.
          - Ctrl+Shift+Space opens Orbit commands to search tabs and frames, open the canvas, or toggle focus mode.
          - Send to canvas in the page wheel collects a page, link, or selected text. Private captures stay in the private window.

          SHA-256 checksums are in the .sha256 files below.
          EOF
          printf '\nVerified source commit: %s\n' "$ORBIT_COMMIT" >> release-notes.md
          if ! gh release view windows-prototype >/dev/null 2>&1; then
            gh release create windows-prototype --target "$ORBIT_COMMIT" --title 'Orbit for Windows' --latest --notes-file release-notes.md
          fi
          # The release's source archives should match the published browser.
          gh api -X PATCH "repos/$GH_REPO/git/refs/tags/windows-prototype" -f sha="$ORBIT_COMMIT" -F force=true >/dev/null ||
            echo "::warning::Could not move the windows-prototype tag to $ORBIT_COMMIT"
          gh release upload windows-prototype installer/Orbit-Setup.exe installer/Orbit-Setup.exe.sha256 \
            installer/Orbit-Windows-x64-portable.zip installer/Orbit-Windows-x64-portable.zip.sha256 --clobber
          # Publish the manifest last. Mixed assets during publication fail hash checks.
          gh release upload windows-prototype update/Orbit-UI-Update.zip update/Orbit-Update-Setup.zip --clobber
          gh release upload windows-prototype update/orbit-update.json --clobber
          gh release edit windows-prototype --title 'Orbit for Windows' --prerelease=false --latest --notes-file release-notes.md

      - name: Verify the public installer and portable downloads
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ProgressPreference = 'SilentlyContinue'
          $base = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/windows-prototype"
          foreach ($name in 'Orbit-Setup.exe', 'Orbit-Windows-x64-portable.zip') {
            $download = Join-Path $env:RUNNER_TEMP $name
            Invoke-WebRequest "$base/$name" -OutFile $download
            $expected = (Get-Content "installer/$name.sha256" -Raw).Split(' ')[0]
            if ((Get-FileHash $download -Algorithm SHA256).Hash.ToLowerInvariant() -ne $expected) { throw "Public $name differs from the tested file" }
          }
          # Websites can also link to the latest release.
          $latest = Invoke-WebRequest "https://github.com/$env:GITHUB_REPOSITORY/releases/latest/download/Orbit-Setup.exe.sha256"
          if ($latest.Content.Trim() -ne (Get-Content installer/Orbit-Setup.exe.sha256 -Raw).Trim()) { throw 'The latest-release link does not serve this installer' }

      - name: Verify the actual public download and update flow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory online-browser/profile | Out-Null
          Set-Content online-browser/profile/update-preservation.txt 'Existing Orbit profile'
          Set-Content online-browser/omni.ja 'Old interface archive'
          Set-Content online-browser/browser/omni.ja 'Old browser interface archive'
          # Exercise the user's CMD launcher and its child powershell.exe -File.
          # Closed stdin prevents an error pause from hanging verification.
          & $env:ComSpec /d /c 'online-browser\Update-Orbit.cmd -NoLaunch < NUL'
          if ($LASTEXITCODE -ne 0) { throw 'Public interface update failed' }
          $manifest = Get-Content update/orbit-update.json -Raw | ConvertFrom-Json
          foreach ($file in $manifest.files) {
            $actual = (Get-FileHash (Join-Path online-browser $file.path) -Algorithm SHA256).Hash
            if ($actual -ne $file.sha256) { throw 'Public download installed different interface files' }
          }
          if ((Get-Content online-browser/profile/update-preservation.txt -Raw).Trim() -ne 'Existing Orbit profile') { throw 'Public update changed the profile' }
          # Rechecking a current installation must skip the UI ZIP download.
          & $env:ComSpec /d /c 'online-browser\Update-Orbit.cmd -NoLaunch < NUL'
          if ($LASTEXITCODE -ne 0) { throw 'Already-current update check failed' }
