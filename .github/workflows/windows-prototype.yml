name: Windows native prototype

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  actions: read

concurrency:
  group: orbit-windows-${{ github.ref }}
  cancel-in-progress: true

jobs:
  windows:
    name: Build and verify native Orbit (Windows x64)
    runs-on: windows-2022
    timeout-minutes: 120
    env:
      MOZILLABUILD: C:\mozilla-build
      MOZ_AUTOMATION: '1'
      MACH_BUILD_PYTHON_NATIVE_PACKAGE_SOURCE: system
      MACH_HIDE_DEV_DRIVE_SUGGESTION: '1'
      MACH_TELEMETRY_NO_SUBMIT: '1'
      MOZBUILD_STATE_PATH: C:\orbit-mozbuild
    steps:
      - name: Check out Orbit source changes
        uses: actions/checkout@v4

      - name: Install Python for verification scripts
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Node for native interface checks
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Test source preparation guards
        shell: pwsh
        run: python -m unittest discover -s tests -v

      - name: Test Windows updater integrity and rollback
        shell: powershell
        run: ./scripts/test_update.ps1

      - name: Check native interface and tab bridge behavior
        shell: pwsh
        run: |
          python -c "from pathlib import Path; scope = {'MOZ_SRC_FILES': []}; exec(Path('overlay/browser/components/orbit/moz.build').read_text(), scope); assert scope['MOZ_SRC_FILES'] == sorted(scope['MOZ_SRC_FILES']), 'Firefox source modules must be sorted'"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check overlay/browser/components/orbit/Orbit.sys.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node --check overlay/browser/base/content/orbit/orbit.js
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/native-bridge.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          foreach ($module in 'OrbitRadial', 'OrbitRadialChild', 'OrbitRadialParent', 'OrbitRadialView') {
            node --check "overlay/browser/components/orbit/$module.sys.mjs"
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
          node tests/radial-view.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          node tests/radial-native.test.mjs
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

      - name: Find a tested browser with matching native source
        id: baseline
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const { data } = await github.rest.actions.listArtifactsForRepo({ owner, repo, per_page: 100 });
            const previous = data.artifacts.find(artifact =>
              artifact.name === 'Orbit-Windows-x64' && !artifact.expired &&
              artifact.workflow_run?.head_branch === 'main' &&
              artifact.workflow_run?.head_repository_id === context.payload.repository.id);
            core.setOutput('run_id', previous?.workflow_run.id || '');
            core.setOutput('reuse', 'false');
            if (!previous) return;
            core.info(`Testing the installed browser from run ${previous.workflow_run.id}`);
            const run = await github.rest.actions.getWorkflowRun({ owner, repo, run_id: previous.workflow_run.id });
            if (run.data.conclusion !== 'success') return;
            const comparison = await github.rest.repos.compareCommitsWithBasehead({
              owner, repo, basehead: `${previous.workflow_run.head_sha}...${context.sha}`
            });
            const files = comparison.data.files;
            if (!files || files.length >= 300 || !['ahead', 'identical'].includes(comparison.data.status)) return;
            const nativeInput = /^(overlay\/|configs\/|firefox-source\.json$|scripts\/(build\.py|prepare_source\.py|windows-build\.sh)$)/;
            if (files.some(file => nativeInput.test(file.filename) || nativeInput.test(file.previous_filename || ''))) return;
            const prior = await github.rest.repos.getContent({
              owner, repo, path: '.github/workflows/windows-prototype.yml', ref: previous.workflow_run.head_sha
            });
            const before = Buffer.from(prior.data.content, 'base64').toString('utf8').replace(/\r\n/g, '\n');
            const current = fs.readFileSync('.github/workflows/windows-prototype.yml', 'utf8').replace(/\r\n/g, '\n');
            const env = text => text.match(/\n    env:\n([\s\S]*?)\n    steps:/)?.[1];
            const build = text => text.match(/^      - name: Build pinned Gecko with Orbit native UI\n[\s\S]*?        run: \|\n([\s\S]*?)(?=\n      - name:)/m)?.[1];
            if (!env(before) || !build(before) || env(before) !== env(current) || build(before) !== build(current)) return;
            core.setOutput('reuse', 'true');
            core.info('Native source, configuration, build environment, and build command match the tested artifact.');

      - name: Reuse the matching verified native browser
        if: steps.baseline.outputs.reuse == 'true'
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows-x64
          path: C:/orbit-firefox/obj-orbit/dist/orbit
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Install official MozillaBuild tools
        if: steps.baseline.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installer = Join-Path $env:RUNNER_TEMP 'MozillaBuildSetup.exe'
          Invoke-WebRequest 'https://ftp.mozilla.org/pub/mozilla/libraries/win32/MozillaBuildSetup-Latest.exe' -OutFile $installer
          $process = Start-Process $installer -ArgumentList '/S', '/D=C:\mozilla-build' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "MozillaBuild installation failed: $($process.ExitCode)" }
          if (-not (Test-Path 'C:\mozilla-build\msys2\usr\bin\bash.exe')) { throw 'MozillaBuild Bash is missing' }
          if (-not (Test-Path 'C:\mozilla-build\python3\python.exe')) { throw 'MozillaBuild Python is missing' }
          $version = [version](Get-Content 'C:\mozilla-build\VERSION' -Raw).Trim()
          if ($version -lt [version]'4.0') { throw "Unsupported MozillaBuild version: $version" }
          Write-Host "MozillaBuild $version"

      - name: Install native artifact decompression dependency
        if: steps.baseline.outputs.reuse != 'true'
        shell: pwsh
        run: |
          & 'C:\mozilla-build\python3\python.exe' -m pip install --only-binary=:all: 'zstandard==0.25.0'
          if ($LASTEXITCODE -ne 0) { throw "Artifact dependency installation failed: $LASTEXITCODE" }

      - name: Cache pinned Gecko and toolchain downloads
        if: steps.baseline.outputs.reuse != 'true'
        uses: actions/cache@v4
        with:
          # These are the pinned upstream download caches, not Orbit's source,
          # object directory, generated interface archives, or packaged browser.
          path: |
            C:/orbit-mozbuild/package-frontend
            C:/orbit-mozbuild/toolchains
          key: orbit-mozbuild-downloads-v1-windows-2022-${{ runner.arch }}-${{ hashFiles('firefox-source.json', 'configs/mozconfig', 'scripts/build.py', 'scripts/windows-build.sh', '.github/workflows/windows-prototype.yml') }}

      - name: Build pinned Gecko with Orbit native UI
        if: steps.baseline.outputs.reuse != 'true'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $repo = $env:GITHUB_WORKSPACE.Replace('\', '/')
          $script = "$repo/scripts/windows-build.sh"
          & 'C:\mozilla-build\msys2\usr\bin\bash.exe' --noprofile --norc $script $repo C:/orbit-firefox
          if ($LASTEXITCODE -ne 0) { throw "Orbit native build failed: $LASTEXITCODE" }

      - name: Package native portable browser
        shell: pwsh
        run: python scripts/package_windows.py --source C:/orbit-firefox --output artifacts

      - name: Install Marionette client from the pinned Firefox source
        shell: pwsh
        env:
          ORBIT_REUSE_NATIVE: ${{ steps.baseline.outputs.reuse }}
        run: |
          $ErrorActionPreference = 'Stop'
          $clientSource = 'C:/orbit-firefox'
          if ($env:ORBIT_REUSE_NATIVE -eq 'true') {
            # Fetch only the exact pinned automation client, not the whole Firefox tree.
            $clientSource = 'C:/orbit-marionette'
            $pin = Get-Content firefox-source.json -Raw | ConvertFrom-Json
            git init $clientSource
            if ($LASTEXITCODE -ne 0) { throw 'Could not initialize the pinned test client checkout' }
            git -C $clientSource config core.longpaths true
            git -C $clientSource config core.autocrlf false
            git -C $clientSource remote add origin $pin.repository
            git -C $clientSource config remote.origin.promisor true
            git -C $clientSource config remote.origin.partialclonefilter blob:none
            git -C $clientSource sparse-checkout init --cone
            git -C $clientSource sparse-checkout set testing/marionette/client
            git -C $clientSource fetch --filter=blob:none --depth=1 origin $pin.revision
            if ($LASTEXITCODE -ne 0) { throw 'Could not fetch the pinned test client' }
            git -C $clientSource checkout --detach FETCH_HEAD
            if ($LASTEXITCODE -ne 0) { throw 'Could not check out the pinned test client' }
          }
          python -m pip install "$clientSource/testing/marionette/client"
          if ($LASTEXITCODE -ne 0) { throw 'Pinned test client installation failed' }

      - name: Verify real native tabs and Orbit canvas in the packaged browser
        shell: pwsh
        run: python scripts/smoke_test.py --binary artifacts/Orbit/orbit.exe --report test-results/smoke.json

      - name: Verify native radial page actions and held tab switching
        shell: pwsh
        run: python scripts/smoke_radial.py --binary artifacts/Orbit/orbit.exe --report test-results/radial/smoke.json

      - name: Package the lightweight interface update
        shell: pwsh
        run: python scripts/package_update.py --package artifacts/Orbit --output artifacts/update --commit $env:GITHUB_SHA

      - name: Download the previous browser inside CI
        if: steps.baseline.outputs.run_id != ''
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows-x64
          path: artifacts/Orbit-Update-Check
          run-id: ${{ steps.baseline.outputs.run_id }}
          github-token: ${{ github.token }}

      - name: Apply the update to an existing native installation
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          $previousPin = 'artifacts/Orbit-Update-Check/firefox-source.json'
          if (Test-Path $previousPin) {
            $old = Get-Content $previousPin -Raw | ConvertFrom-Json
            $current = Get-Content firefox-source.json -Raw | ConvertFrom-Json
            if ($old.revision -ne $current.revision -or $old.artifact_revision -ne $current.artifact_revision) {
              Write-Host 'A new engine needs a complete browser; checking this engine installation instead.'
              Remove-Item artifacts/Orbit-Update-Check -Recurse -Force
            }
          }
          if (-not (Test-Path artifacts/Orbit-Update-Check/orbit.exe)) {
            Copy-Item artifacts/Orbit artifacts/Orbit-Update-Check -Recurse
          }
          New-Item -ItemType Directory artifacts/Orbit-Update-Check/profile | Out-Null
          Set-Content artifacts/Orbit-Update-Check/profile/update-preservation.txt 'Existing Orbit profile'
          # Force actual replacement of both interface archives; keep the native engine.
          Set-Content artifacts/Orbit-Update-Check/omni.ja 'Old interface archive'
          Set-Content artifacts/Orbit-Update-Check/browser/omni.ja 'Old browser interface archive'
          & ./scripts/windows/Update-Orbit.ps1 -InstallDirectory artifacts/Orbit-Update-Check -ManifestPath artifacts/update/orbit-update.json -ArchivePath artifacts/update/Orbit-UI-Update.zip -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Offline interface update failed' }
          if ((Get-Content artifacts/Orbit-Update-Check/profile/update-preservation.txt -Raw).Trim() -ne 'Existing Orbit profile') { throw 'Update changed the existing profile' }
          if (-not (Test-Path artifacts/Orbit-Update-Check/browser/.purgecaches)) { throw 'Updated UI will not invalidate startup caches' }

      - name: Verify the updated browser still renders Gecko and the canvas
        shell: pwsh
        run: |
          python scripts/smoke_test.py --binary artifacts/Orbit-Update-Check/orbit.exe --report test-results/updated/smoke.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (Test-Path artifacts/Orbit-Update-Check/browser/.purgecaches) { throw 'Firefox did not consume the interface cache invalidation marker' }

      - name: Verify radial gestures after updating an existing installation
        shell: pwsh
        run: python scripts/smoke_radial.py --binary artifacts/Orbit-Update-Check/orbit.exe --report test-results/updated/radial/smoke.json

      - name: Upload tested lightweight update and setup
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-UI-Update
          path: artifacts/update/
          if-no-files-found: error
          retention-days: 14

      - name: Upload tested Windows browser
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-x64
          path: artifacts/Orbit/
          if-no-files-found: error
          retention-days: 14

      - name: Collect native build diagnostic logs
        if: always()
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path test-results | Out-Null
          $logs = @{
            'C:/orbit-firefox/obj-orbit/config.log' = 'test-results/config.log'
            'C:/orbit-firefox/.mozconfig' = 'test-results/mozconfig.txt'
            'C:/orbit-firefox/.orbit-source.json' = 'test-results/firefox-source.json'
          }
          foreach ($source in $logs.Keys) {
            if (Test-Path $source) { Copy-Item -Path $source -Destination $logs[$source] -Force }
          }

      - name: Upload verification and diagnostic logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Orbit-Windows-diagnostics
          path: test-results/
          if-no-files-found: ignore
          retention-days: 14

  publish-update:
    name: Publish tested prototype interface update
    needs: windows
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: windows-2022
    permissions:
      contents: write
    steps:
      - name: Download verified interface update
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows-UI-Update
          path: update

      - name: Download the verified browser for the online updater check
        uses: actions/download-artifact@v4
        with:
          name: Orbit-Windows-x64
          path: online-browser

      - name: Publish the Windows prototype update channel
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          ORBIT_COMMIT: ${{ github.sha }}
        run: |
          cat > release-notes.md <<'EOF'
          Close Orbit, then run Update-Orbit.cmd to test the latest verified interface.

          Quick right-click on a webpage opens Orbit's radial page actions. Open in new tab is in the center. Hover a submenu to reveal an outer ring. Hold the right button to explore open tabs, hover a tab, then release to switch; tab groups and More open further rings.

          For an existing installation, download Orbit-Update-Setup.zip and extract its two files beside orbit.exe once. Future interface changes download only the small UI package; your existing profile and Gecko engine are kept.

          Full browser downloads and native test results are available from the Windows prototype workflow. A new Gecko engine requires a complete browser download.
          EOF
          printf '\nVerified source commit: %s\n' "$ORBIT_COMMIT" >> release-notes.md
          if ! gh release view windows-prototype >/dev/null 2>&1; then
            gh release create windows-prototype --target "$ORBIT_COMMIT" --title 'Orbit Windows prototype updates' --prerelease --notes-file release-notes.md
          fi
          # Publish the manifest last. Mixed assets during publication fail hash checks.
          gh release upload windows-prototype update/Orbit-UI-Update.zip update/Orbit-Update-Setup.zip --clobber
          gh release upload windows-prototype update/orbit-update.json --clobber
          gh release edit windows-prototype --title 'Orbit Windows prototype updates' --prerelease --notes-file release-notes.md

      - name: Verify the actual public download and update flow
        shell: powershell
        run: |
          $ErrorActionPreference = 'Stop'
          New-Item -ItemType Directory online-browser/profile | Out-Null
          Set-Content online-browser/profile/update-preservation.txt 'Existing Orbit profile'
          Set-Content online-browser/omni.ja 'Old interface archive'
          Set-Content online-browser/browser/omni.ja 'Old browser interface archive'
          & ./online-browser/Update-Orbit.ps1 -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Public interface update failed' }
          $manifest = Get-Content update/orbit-update.json -Raw | ConvertFrom-Json
          foreach ($file in $manifest.files) {
            $actual = (Get-FileHash (Join-Path online-browser $file.path) -Algorithm SHA256).Hash
            if ($actual -ne $file.sha256) { throw 'Public download installed different interface files' }
          }
          if ((Get-Content online-browser/profile/update-preservation.txt -Raw).Trim() -ne 'Existing Orbit profile') { throw 'Public update changed the profile' }
          # Rechecking a current installation must skip the UI ZIP download.
          & ./online-browser/Update-Orbit.ps1 -NoLaunch
          if ($LASTEXITCODE -ne 0) { throw 'Already-current update check failed' }
